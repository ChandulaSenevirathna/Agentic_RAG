[project]
name = "agentic-rag"
version = "0.1.0"
description = "Three agentic RAG patterns built with LangGraph: Agentic RAG, Corrective RAG, and Adaptive RAG."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arxiv>=2.1.0,<3.0.0",
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "langchain>=1.3.15",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.4",
    "langchain-google-genai>=4.3.4",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-tavily>=0.2.0",
    "langgraph>=1.2.11",
    "langgraph-cli[inmem]>=0.4.31",
    "langsmith>=0.11.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "sentence-transformers>=6.0.0",
]

[tool.uv]
package = false
